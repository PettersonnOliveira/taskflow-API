<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TaskFlow - Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header class="dashboard-header">
            <div class="logo">
                <h1>TaskFlow</h1>
            </div>
            <div class="user-info">
                <span id="userName"></span>
                <button id="logoutBtn" class="btn btn-secondary">Sair</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="dashboard-main">
            <!-- Add Task Section -->
            <section class="add-task-section">
                <h2>Nova Tarefa</h2>
                <form id="addTaskForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="taskTitle">Título</label>
                            <input type="text" id="taskTitle" name="title" required placeholder="Título da tarefa">
                        </div>
                        <div class="form-group">
                            <label for="taskDescription">Descrição</label>
                            <input type="text" id="taskDescription" name="description" placeholder="Descrição (opcional)">
                        </div>
                        <button type="submit" class="btn btn-primary">Adicionar</button>
                    </div>
                </form>
            </section>

            <!-- Tasks List -->
            <section class="tasks-section">
                <div class="tasks-header">
                    <h2>Minhas Tarefas</h2>
                    <div class="filter-buttons">
                        <button class="filter-btn active" data-filter="all">Todas</button>
                        <button class="filter-btn" data-filter="PENDING">Pendentes</button>
                        <button class="filter-btn" data-filter="IN_PROGRESS">Em Progresso</button>
                        <button class="filter-btn" data-filter="COMPLETED">Concluídas</button>
                    </div>
                </div>
                <div id="tasksList" class="tasks-list">
                    <!-- Tasks will be loaded here -->
                </div>
                <p id="noTasks" class="no-tasks" style="display: none;">Nenhuma tarefa encontrada</p>
            </section>
        </main>
    </div>

    <!-- Edit Task Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Tarefa</h3>
                <button class="close-modal">&times;</button>
            </div>
            <form id="editTaskForm">
                <input type="hidden" id="editTaskId">
                <div class="form-group">
                    <label for="editTitle">Título</label>
                    <input type="text" id="editTitle" name="title" required>
                </div>
                <div class="form-group">
                    <label for="editDescription">Descrição</label>
                    <input type="text" id="editDescription" name="description">
                </div>
                <div class="form-group">
                    <label for="editStatus">Status</label>
                    <select id="editStatus" name="status">
                        <option value="PENDING">Pendente</option>
                        <option value="IN_PROGRESS">Em Progresso</option>
                        <option value="COMPLETED">Concluída</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary close-modal-btn">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
